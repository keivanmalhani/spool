[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spool"
version = "0.1.0"
description = "Local-first filament inventory and true print cost calculator for 3D printing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Keivan Malhani" }]
keywords = ["3d-printing", "filament", "inventory", "klipper", "moonraker", "octoprint", "gcode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

# Intentionally empty. spool runs on the standard library alone so that it
# installs on a Raspberry Pi next to the printer with no wheels to build.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
spool = "spool.cli:main"

[project.urls]
Homepage = "https://github.com/keivanmalhani/spool"
Issues = "https://github.com/keivanmalhani/spool/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
